name: Margin
options:
  bundleIdPrefix: com.mattbrown
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    PRODUCT_BUNDLE_IDENTIFIER: com.mattbrown.margin
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
packages:
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios-spm
    from: 7.0.0
targets:
  Margin:
    type: application
    platform: iOS
    sources:
      - path: ios/Margin
    dependencies:
      - package: LinkKit
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Margin
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_FILE: ios/Margin/Info.plist
        # Read by the app via Info.plist; replace with the HTTPS bank-service URL.
        MARGIN_API_BASE_URL: "https://api.example.com"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
