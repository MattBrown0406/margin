name: Margin
options:
  bundleIdPrefix: com.mattbrown
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    PRODUCT_BUNDLE_IDENTIFIER: com.mattbrown.margin
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: 4D2KRG86P2
packages:
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios-spm
    from: 7.0.0
targets:
  Margin:
    type: application
    platform: iOS
    sources:
      - path: ios/Margin
    dependencies:
      - package: LinkKit
      - target: MarginWidget
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Stabilis
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # The palette is light-only (cream backgrounds, ink text); dark mode would make text unreadable.
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # HTTPS only: exempt from export-compliance paperwork.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_FILE: ios/Margin/Info.plist
        # Read by the app via Info.plist; replace with the HTTPS bank-service URL.
        MARGIN_API_BASE_URL: "https://margin-bank.onrender.com"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iCloud (CloudKit), Sign in with Apple, and the App Group shared with the widget.
        CODE_SIGN_ENTITLEMENTS: ios/Margin/Margin.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
  MarginWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/MarginWidget
      # The widget recomputes safe-to-spend itself so it can roll over at midnight.
      - path: ios/Margin/Logic/Ledger.swift
      - path: ios/Margin/Logic/Money.swift
      - path: ios/Margin/Logic/SafeToSpend.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattbrown.margin.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ios/MarginWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Stabilis
        CODE_SIGN_ENTITLEMENTS: ios/MarginWidget/MarginWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
